spring:
  application:
    name: eventmind-command

  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: jdbc:h2:file:~/data/commandDB
    driver-class-name: org.h2.Driver
    username: sa
    password: ${COMMAND_DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    properties:
      jakarta:
        persistence:
          schema-generation:
            scripts:
              action: create
              create-target: axon-schema.sql

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: true

server:
  port: 8081

axon:
  axonserver:
    enabled: true
    servers: ${AXON_AXONSERVER_SERVERS:localhost:8124}
  distributed:
    enabled: false
  serializer:
    general: jackson
    events: jackson


logging:
  level:
    org:
      flywaydb: DEBUG