spring:
  application:
    name: eventmind-command

  config:
    # .env is optional everywhere: ./<CWD>/.env covers a fat jar run from the repo
    # root and containers; ../.env covers spring-boot:run from the module dir. Every
    # placeholder below also has a default, so the app starts without any .env at all.
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]

server:
  port: 8081

axon:
  axonserver:
    enabled: true
    servers: ${AXON_AXONSERVER_SERVERS:localhost:8124}
  distributed:
    enabled: false
  serializer:
    general: jackson
    events: jackson
  kafka:
    bootstrap-servers: ${AXON_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: eventmind-command
    default-topic: eventmind.events
    # Producer only: every event published on the local event bus (e.g.
    # SymptomCreatedEvent) is forwarded to the shared topic by the auto-configured
    # KafkaEventPublisher. The consumer side is disabled - the command module never
    # reads events back from Kafka.
    publisher:
      enabled: true
      processing-group: __axon-kafka-event-publishing-group
    producer:
      event-processor-mode: subscribing
    fetcher:
      enabled: false
