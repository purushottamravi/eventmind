services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: eventmind-postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=eventmind
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # First-boot init scripts (CREATE EXTENSION vector, ...)
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: eventmind-ollama
    hostname: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    # Pull the chat model once so the AI module can analyse out of the box:
    #   docker compose exec ollama ollama pull llama3.1

  axonserver:
    image: axoniq/axonserver:2024.2.2
    container_name: eventmind-axonserver
    hostname: axonserver
    restart: unless-stopped
    environment:
      - axoniq_axonserver_hostname=localhost
      - axoniq_axonserver_internal_hostname=axonserver
    ports:
      - "8024:8024"
      - "8124:8124"
      - "8224:8224"
    volumes:
      - axonserver-data:/axonserver/data
      - axonserver-events:/axonserver/events

  # ---- Application services (built from the root Dockerfile) ----
  # Each fat jar takes its whole config from environment variables set here, so a
  # .env file is never needed at runtime. Values fall back to the same defaults the
  # modules carry in their application.yml.
  command:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: eventmind-command
    container_name: eventmind-command
    restart: unless-stopped
    depends_on:
      axonserver:
        condition: service_started
    environment:
      AXON_AXONSERVER_SERVERS: axonserver:8124
    ports:
      - "8081:8081"

  query:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: eventmind-query
    container_name: eventmind-query
    restart: unless-stopped
    depends_on:
      axonserver:
        condition: service_started
    environment:
      AXON_AXONSERVER_SERVERS: axonserver:8124
      QUERY_DB_PASSWORD: ${QUERY_DB_PASSWORD:-postgres}
    volumes:
      # Shared H2 file DBs (~/data/queryDB) so the read model survives restarts.
      - app-data:/root/data
    ports:
      - "8082:8082"

  observability:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: eventmind-observability
    container_name: eventmind-observability
    restart: unless-stopped
    depends_on:
      axonserver:
        condition: service_started
    environment:
      AXON_AXONSERVER_SERVERS: axonserver:8124
      OBSERVABILITY_DB_PASSWORD: ${OBSERVABILITY_DB_PASSWORD:-postgres}
      EVENTMIND_AI_BASE_URL: http://ai:8080
    volumes:
      # Shared H2 file DBs (~/data/symptomDB) so the audit log survives restarts.
      - app-data:/root/data
    ports:
      - "8083:8083"

  ai:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: eventmind-ai
    container_name: eventmind-ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/eventmind
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      OLLAMA_BASE_URL: http://ollama:11434
      EVENTMIND_OBSERVABILITY_BASE_URL: http://observability:8083
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  ollama-models:
  axonserver-data:
  axonserver-events:
  app-data:
