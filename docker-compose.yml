services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: eventmind-postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=eventmind
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # First-boot init scripts (CREATE EXTENSION vector, ...)
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: eventmind-ollama
    hostname: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    # Pull the chat model once so the AI module can analyse out of the box:
    #   docker compose exec ollama ollama pull llama3.1

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: eventmind-kafka
    hostname: kafka
    restart: unless-stopped
    environment:
      # Single-node KRaft (no ZooKeeper). The cluster id is just a stable UUID.
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      # Advertise both names: other containers reach the broker as "kafka:9092",
      # a dev host process reaches it as "localhost:9092" (host 9092 -> container 29092).
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # eventmind.events is created on first publish (single-broker cluster)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      # Host 9092 maps to the container's EXTERNAL listener (29092); the INTERNAL
      # (kafka:9092) listener is only reachable from the compose network.
      - "9092:29092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ---- Application services (built from the root Dockerfile) ----
  # Each fat jar takes its whole config from environment variables set here, so a
  # .env file is never needed at runtime. Values fall back to the same defaults the
  # modules carry in their application.yml.
  command:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: eventmind-command
    container_name: eventmind-command
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      AXON_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"

  query:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: eventmind-query
    container_name: eventmind-query
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      AXON_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QUERY_DB_PASSWORD: ${QUERY_DB_PASSWORD:-postgres}
    volumes:
      # Shared H2 file DBs (~/data/queryDB) so the read model survives restarts.
      - app-data:/root/data
    ports:
      - "8082:8082"

  observability:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: eventmind-observability
    container_name: eventmind-observability
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      AXON_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OBSERVABILITY_DB_PASSWORD: ${OBSERVABILITY_DB_PASSWORD:-postgres}
      EVENTMIND_AI_BASE_URL: http://ai:8080
    volumes:
      # Shared H2 file DBs (~/data/symptomDB) so the audit log survives restarts.
      - app-data:/root/data
    ports:
      - "8083:8083"

  ai:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: eventmind-ai
    container_name: eventmind-ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/eventmind
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      OLLAMA_BASE_URL: http://ollama:11434
      EVENTMIND_OBSERVABILITY_BASE_URL: http://observability:8083
    ports:
      - "8080:8080"

  # ---- Monitoring stack ----
  prometheus:
    image: prom/prometheus:latest
    container_name: eventmind-prometheus
    hostname: prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: eventmind-grafana
    hostname: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  ollama-models:
  app-data:
  prometheus-data:
  grafana-data:
