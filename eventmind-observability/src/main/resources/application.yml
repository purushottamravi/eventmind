spring:
  application:
    name: eventmind-observability

  profiles:
    active: dev

  config:
    # .env is optional everywhere: ./<CWD>/.env covers a fat jar run from the repo
    # root and containers; ../.env covers spring-boot:run from the module dir. Every
    # placeholder below also has a default, so the app starts without any .env at all.
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]

  datasource:
    url: jdbc:h2:file:~/data/symptomDB
    driver-class-name: org.h2.Driver
    username: sa
    password: ${OBSERVABILITY_DB_PASSWORD:postgres}

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: true

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

axon:
  serializer:
    general: jackson
    events: jackson
  kafka:
    bootstrap-servers: ${AXON_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: eventmind-observability
    default-topic: eventmind.events
    # Consumer only: the "observability" tracking processor is wired to the
    # StreamableKafkaMessageSource in KafkaEventProcessingConfig. The publisher side
    # is disabled so consumed events are never echoed back onto the topic.
    publisher:
      enabled: false
    consumer:
      event-processor-mode: tracking
      enable-auto-commit: false
    fetcher:
      enabled: true
      poll-timeout: 5000

eventmind:
  ai:
    base-url: ${EVENTMIND_AI_BASE_URL:http://localhost:8080}
  observability:
    jfr:
      enabled: true # making it false forces Spring to completely skip loading the listener!

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%t] [%X{correlationId:-}] %c{1} - %msg%n"
  level:
    org:
      flywaydb: DEBUG