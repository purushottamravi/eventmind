spring:
  application:
    name: eventmind-query

  datasource:
    url: jdbc:h2:file:~/data/queryDB
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create

  flyway:
    enabled: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8082

axon:
  axonserver:
    enabled: true
    servers: ${AXON_AXONSERVER_SERVERS:localhost:8124}
  distributed:
    enabled: false
  serializer:
    general: jackson
    events: jackson
  event-handling:
    processors:
      symptom:
        mode: tracking

logging:
  level:
    org.flywaydb: DEBUG