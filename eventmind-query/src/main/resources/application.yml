spring:
  application:
    name: eventmind-query

  config:
    # .env is optional everywhere: ./<CWD>/.env covers a fat jar run from the repo
    # root and containers; ../.env covers spring-boot:run from the module dir. Every
    # placeholder below also has a default, so the app starts without any .env at all.
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]

  datasource:
    url: jdbc:h2:file:~/data/queryDB
    driver-class-name: org.h2.Driver
    username: sa
    password: ${QUERY_DB_PASSWORD:postgres}

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

axon:
  serializer:
    general: jackson
    events: jackson
  kafka:
    bootstrap-servers: ${AXON_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: eventmind-query
    default-topic: eventmind.events
    # Consumer only: the "symptom" tracking processor is wired to the
    # StreamableKafkaMessageSource in KafkaEventProcessingConfig. The publisher side
    # is disabled so consumed events are never echoed back onto the topic.
    publisher:
      enabled: false
    consumer:
      event-processor-mode: tracking
      enable-auto-commit: false
    fetcher:
      enabled: true
      poll-timeout: 5000

logging:
  level:
    org.flywaydb: DEBUG