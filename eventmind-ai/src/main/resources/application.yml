spring:
  application:
    name: eventmind-ai

  config:
    # .env is optional everywhere: ./<CWD>/.env covers a fat jar run from the repo
    # root and containers; ../.env covers spring-boot:run from the module dir. Every
    # placeholder below also has a default, so the app starts without any .env at all.
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventmind}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # update (not validate): Hibernate owns the module's entity tables
      # (healing_recommendation, application_log, ...). Flyway owns the RAG/schema tables.
      ddl-auto: ${DB_DDL_AUTO:update}
    open-in-view: false

  flyway:
    enabled: true

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: llama3.1
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        # The vector_store table is created by Spring AI on startup; the pgvector
        # extension is enabled by the compose init script and Flyway migration.
        initialize-schema: true
        # Must match the embedding model's output size (nomic-embed-text = 768).
        dimensions: ${VECTOR_DIMENSIONS:768}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

eventmind:
  observability:
    base-url: ${EVENTMIND_OBSERVABILITY_BASE_URL:http://localhost:8083}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%t] [%X{correlationId:-}] %c{1} - %msg%n"
  level:
    org.springframework.ai: DEBUG