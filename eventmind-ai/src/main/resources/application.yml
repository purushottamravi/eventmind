spring:
  application:
    name: eventmind-ai

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventmind}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    open-in-view: false

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: llama3.1

eventmind:
  observability:
    base-url: ${EVENTMIND_OBSERVABILITY_BASE_URL:http://localhost:8083}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%t] [%X{correlationId:-}] %c{1} - %msg%n"
  level:
    org.springframework.ai: DEBUG